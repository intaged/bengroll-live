   One vocabulary for every clickable thing on the page. Only transform,

/* --- Buttons, pills, social badges ------------------------------------- */
.bg-press {
  transition: transform .15s ease-out, box-shadow .15s ease-out,
              background-color .15s ease-out, color .15s ease-out, filter .15s ease-out;
  will-change: transform;
  transform: translateZ(0);
  backface-visibility: hidden;
}
/* Hover only where a real pointer exists, so touch taps never stick. */
@media (hover: hover) and (pointer: fine) {
  .bg-press:hover {
    transform: translate3d(-2px, -2px, 0);
    box-shadow: 6px 6px 0px var(--bg-shadow, #0F0D0C);
    filter: brightness(1.03);
  }
}
.bg-press:active {
  transform: translate3d(2px, 2px, 0);
  box-shadow: 1px 1px 0px var(--bg-shadow, #0F0D0C);
  transition-duration: .08s;
  filter: none;
}
.bg-press:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px ${GOLD}, 4px 4px 0px var(--bg-shadow, #0F0D0C);
}

/* --- Cards and containers ---------------------------------------------- */
.bg-liftcard {
  transition: transform .2s ease-out, box-shadow .2s ease-out;
  will-change: transform;
  transform: translateZ(0);
}
@media (hover: hover) and (pointer: fine) {
  .bg-liftcard:hover {
    transform: scale(1.012) translate3d(0, -3px, 0);

  }
}
.bg-liftcard:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px ${GOLD}, 6px 6px 0px var(--bg-shadow, #0F0D0C);
}
